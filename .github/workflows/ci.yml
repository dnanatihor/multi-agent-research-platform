name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install poetry==2.5.1
      - run: poetry install --no-interaction
      - run: poetry run pytest
      - run: poetry show --only main > sbom-packages.txt

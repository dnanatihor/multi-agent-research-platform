[project]
name = "multi-agent-research-platform"
version = "0.1.0"
description = "Orchestrated researcher, analyst, and writer agents with a versioned blackboard and human review."
readme = "README.md"
authors = [
    { name = "Rohit Anand", email = "dnanatihor@gmail.com" },
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents (>=0.7.28,<0.8.0)",
    "fastapi (>=0.139.2,<1.0.0)",
    "langchain (>=1.4.6,<1.5.0)",
    "langchain-openai (>=1.7.2,<1.8.0)",
    "langgraph (>=1.2.16,<1.3.0)",
    "prometheus-client (>=0.20.0,<1.0.0)",
    "pydantic-settings (>=2.6.0,<3.0.0)",
    "uvicorn (>=0.49.0,<1.0.0)",
]

[dependency-groups]
dev = [
    "httpx (>=0.28.1,<1.0.0)",
    "pytest (>=8.3.3,<9.0.0)",
]

[tool.poetry]
packages = [{ include = "research_platform", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
